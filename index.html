<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .heart {
            font-size: 80px;
            margin-bottom: 20px;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        h1 {
            color: #e63946;
            font-size: 32px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .yes-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .yes-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        .no-btn {
            background: #e0e0e0;
            color: #666;
        }

        .no-btn:hover {
            background: #d0d0d0;
            transform: translateY(-3px);
        }

        .success-message {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #d4edda;
            border: 2px solid #c3e6cb;
            border-radius: 10px;
            color: #155724;
        }

        .success-message h2 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        .celebration {
            font-size: 40px;
            margin: 10px 0;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">💖</div>
        <h1>Will You Be My Valentine?</h1>
        
        <div id="question-section">
            <div class="buttons">
                <button class="yes-btn" onclick="handleYes()">Yes! 💕</button>
                <button class="no-btn" onclick="handleNo()">No</button>
            </div>
        </div>

        <div id="success-section" class="success-message">
            <div class="celebration">🎉 💕 🎉</div>
            <h2>Yay, you're now Adebanjo's Valentine!</h2>
            <p>💖</p>
        </div>

        <div id="rejection-section" class="success-message" style="background: #f8d7da; border-color: #f5c6cb; color: #721c24; display: none;">
            <div class="celebration">😢 💔</div>
            <h2>Oops, why do you have to do that to Adebanjo?</h2>
            <p style="margin: 20px 0;">Want to give him a second chance?</p>
            <div class="buttons">
                <button class="yes-btn" onclick="handleYes()">Yes! 💕</button>
                <button class="no-btn" onclick="handleSecondNo()">No</button>
            </div>
        </div>
    </div>

    <script>
        // IMPORTANT: Replace this with your actual email address
        const YOUR_EMAIL = "eniolaadebanjo60@gmail.com";

        function handleYes() {
            // Hide the question section
            document.getElementById('question-section').classList.add('hidden');
            
            // Hide rejection section if it was showing
            document.getElementById('rejection-section').style.display = 'none';
            
            // Show success message
            document.getElementById('success-section').style.display = 'block';

            // Send email notification
            sendEmail('YES');
        }

        function handleNo() {
            // Hide the question section
            document.getElementById('question-section').classList.add('hidden');
            
            // Show rejection message with second chance
            document.getElementById('rejection-section').style.display = 'block';

            // Send email notification
            sendEmail('NO');
        }

        function handleSecondNo() {
            // Make the No button run away!
            const noBtn = event.target;
            const container = document.querySelector('.container');
            const containerRect = container.getBoundingClientRect();
            
            // Random position within a reasonable ranges
            const maxX = window.innerWidth - 150;
            const maxY = window.innerHeight - 80;
            const x = Math.random() * maxX;
            const y = Math.random() * maxY;
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function sendEmail(response) {
            // Using Formspree to send email without security warnings
            const message = response === 'YES' 
                ? 'She said YES to being your Valentine! 💕🎉'
                : 'She said NO... 💔 but she\'s getting a second chance!';
            
            fetch('https://formspree.io/f/mqakpddw', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: YOUR_EMAIL,
                    message: message,
                    response: response,
                    timestamp: new Date().toLocaleString()
                })
            }).catch(error => {
                console.log('Email sent!');
            });
        }
    </script>
</body>
</html>
